<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Pure Glow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="product-style.css">
    <link rel="stylesheet" href="navbar.css">

</head>

<body>
    <!-- Nav bar -->
     
    <header class="header">
        <nav class="navigation">
            <a href="index.html" class="logo">
                <img src="PureGlow logo (1).png" alt="Logo">
            </a>
            <input type="checkbox" id="menu-btn" class="menu-btn">
            <label for="menu-btn" class="menu-icon"><i class="fa-solid fa-bars"></i></label>


            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="pure-glow.html">Categories</a></li>
                <li><a href="footer.html">About Us</a></li>
            </ul>
            <form class="search-box">
                <input type="text" placeholder="Search Product" required />
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
            <div class="nav-btns">
                <a href="pro.html" class="nav-user"><i class="fa-regular fa-user"></i></a>
                <a href="#" class="nav-cart"><i class="fa-solid fa-cart-arrow-down"></i>
                    <span class="cart-count">0</span>
                </a>
                <button id="clear-cart">Clear the basket</button>

            </div>
        </nav>
    </header>

    <div class="product-container" id="product-content">
        <div class="product-image">
            <img id="main-img" src="" alt="Product Image">
        </div>

        <div class="product-details">
            <h1 id="product-title">Loading Product...</h1>
            <p class="price" id="product-price"></p>
            <p class="description" id="product-desc"></p>

            <div class="actions">
                <button class="btn-outline">Add to Cart</button>
            </div>

            <br><br>
            <a href="index.html" class="back-link" style="color: #0e0000; text-decoration: none;">← Back to Home</a>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
</body>

</html>
